# Matrix 适配器配置模板。
#
# 这个文件只是模板，Runner 不会读取它。
# 首次加载插件时，Runner 会在插件目录生成真正的 config.toml（也可以在 WebUI 里编辑）。
# 复制为 config.toml 后请至少填写 matrix.homeserver、matrix.user_id 和 matrix.password。

[plugin]
enabled = false
config_version = "0.1.0"

[matrix]
homeserver = "https://matrix.example.org"
user_id = "@maibot:example.org"   # 改成机器人的完整 MXID
password = ""                     # 首次登录后改用保存的访问令牌
access_token = ""                 # 可选；填写时需同时填写 device_id
device_id = ""                    # 留空自动生成并持久化，运行中不要修改
device_name = "MaiBot"
store_passphrase = ""             # 修改后旧的加密存储将无法读取
proxy_url = ""
sync_timeout_ms = 30000
reconnect_delay_sec = 5
auto_join = true
dm_max_members = 2
send_read_receipt = true
ignore_unverified_devices = true
max_download_mb = 50
text_chunk_chars = 8000
